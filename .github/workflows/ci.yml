name: CI

on:
  workflow_dispatch:
  workflow_call: # the Release workflow runs these checks before it packs
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.framework }}, ${{ matrix.dependencies }} dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        framework: [net8.0, net10.0]
        # floor = the versions the library is built against, latest = the newest stable releases at the time of the run,
        # see tests/BetterStack.Logs.Serilog.Tests/BetterStack.Logs.Serilog.Tests.csproj
        dependencies: [floor, latest]
        include:
          - { os: windows-latest, framework: net48, dependencies: floor }
          - { os: windows-latest, framework: net48, dependencies: latest }
    env:
      # MSBuild reads environment variables as properties, this one selects the dependency versions in the test project
      DependencySet: ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test tests/BetterStack.Logs.Serilog.Tests -f ${{ matrix.framework }}
      - name: Show the dependency versions the tests ran with
        run: dotnet list tests/BetterStack.Logs.Serilog.Tests package --framework ${{ matrix.framework }} --no-restore
